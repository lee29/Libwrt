# 必读！！！
# 来源：https://github.com/qichiyuhub/rule/blob/main/config/mihomo/config.yaml
# 此版本没有做防泄露处理，如介意请使用另一个名字为configdns的版本
# 注意规则在满足自己需求情况下，尽量做到精简，不要过度复杂，以免影响性能。
# 跑裸核用户请自行去掉下方控制面板模块的注释。
# 机场订阅
proxy-providers:
  Airport1:
    url: "https://vistart.art/sbciiol/"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: ♻️ 自动选择

  Airport2:
    url: "https://dasho.pqjc.site/api/v1/pq/"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

# 节点信息
proxies:
  - {name: 直连, type: direct}

# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 为防止使用插件朋友遇到面板问题，我注释掉了此模块。
#external-controller: 0.0.0.0:9090
#secret: ""
#external-ui: ui
#external-ui-name: zashboard
#external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: false    # ← 改动：原来是 true，改为 false 防止覆盖 CDN 目标
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:                       # ← 改动：追加 B站域名跳过嗅探
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.bilibili.com"
    - "+.hdslb.com"
    - "+.bilivideo.com"
    - "+.biliapi.com"
    - "+.b23.tv"
    - "+.acgvideo.com"

# 入站
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"
    # ↓ 改动：手动追加 B站全系列域名，排除 Fake-IP
    - "bilibili.com"
    - "+.bilibili.com"
    - "hdslb.com"
    - "+.hdslb.com"
    - "hdslb.tv"
    - "+.hdslb.tv"
    - "bilivideo.com"
    - "+.bilivideo.com"
    - "biliapi.com"
    - "+.biliapi.com"
    - "b23.tv"
    - "+.b23.tv"
    - "acgvideo.com"
    - "+.acgvideo.com"
    - "ibilibili.com"
    - "+.ibilibili.com"
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # ↓ 改动：新增 nameserver-policy，国内走国内 DoH，国外走 Cloudflare
  nameserver-policy:
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    "geosite:cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

# 出站策略
proxy-groups:
